<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — NovaVid AI YouTube Studio (LODHI TECHX)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans flex flex-col min-h-screen">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">N</div>
        <span class="text-lg font-black tracking-tight text-white">NovaVid <span class="text-sky-400">AI</span></span>
      </a>
      <a href="index.html" class="text-xs text-slate-400 hover:text-white">← Home</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-6">
        <span class="px-2.5 py-1 rounded bg-sky-500/10 border border-sky-500/30 text-sky-400 text-[10px] font-bold uppercase tracking-wider">
          LODHI TECHX Customer Portal
        </span>
        <h1 class="text-2xl font-bold text-white mt-2">Sign In to Your Account</h1>
        <p class="text-xs text-slate-400 mt-1">Manage your active SaaS subscriptions, license keys, and device seats.</p>
      </div>

      <form class="space-y-4 text-xs" onsubmit="event.preventDefault(); alert('Redirecting to authenticated Customer Portal session...');">
        <div>
          <label class="block font-semibold text-slate-300 mb-1">Email Address</label>
          <input required type="email" placeholder="you@domain.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-semibold text-slate-300">Password</label>
            <a href="#" class="text-sky-400 hover:underline text-[11px]">Forgot password?</a>
          </div>
          <input required type="password" placeholder="••••••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500" />
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-sky-600/30 transition-all">
          Sign In to Portal
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
        Don't have an account yet? <a href="register.html" class="text-sky-400 font-semibold hover:underline">Register here</a>
      </div>
    </div>
  </main>

  <footer class="py-6 border-t border-slate-800 text-center text-xs text-slate-500">
    © 2026 LODHI TECHX. All rights reserved.
  </footer>
</body>
</html>
