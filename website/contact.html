<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact LODHI TECHX — Support & Enterprise Inquiries</title>
  <meta name="description" content="Get in touch with LODHI TECHX support, agency licensing, and developer inquiries for NovaVid AI YouTube Studio.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans">
  <!-- Nav -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">N</div>
        <span class="text-lg font-black tracking-tight text-white">NovaVid <span class="text-sky-400">AI</span></span>
      </a>
      <div class="flex items-center gap-4 text-xs font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-white">Home</a>
        <a href="download.html" class="text-slate-400 hover:text-white">Download</a>
        <a href="index.html#pricing" class="text-slate-400 hover:text-white">Pricing</a>
        <a href="about.html" class="text-slate-400 hover:text-white">About</a>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-16">
    <div class="text-center">
      <span class="px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/30 text-sky-400 text-xs font-semibold">
        Support & Communications
      </span>
      <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight mt-3">
        Get In Touch With LODHI TECHX
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm mt-2">
        Have questions about licensing, custom agency integrations, or technical support? Fill out the form below.
      </p>
    </div>

    <form class="mt-8 p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-4 text-xs shadow-xl" onsubmit="event.preventDefault(); alert('Thank you! Your message has been received by LODHI TECHX support.');">
      <div>
        <label class="block font-semibold text-slate-300 mb-1">Your Full Name</label>
        <input required type="text" placeholder="e.g. Umar Hayat" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-sky-500" />
      </div>

      <div>
        <label class="block font-semibold text-slate-300 mb-1">Email Address</label>
        <input required type="email" placeholder="e.g. contact@lodhitechx.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-sky-500" />
      </div>

      <div>
        <label class="block font-semibold text-slate-300 mb-1">Inquiry Type</label>
        <select class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-sky-500">
          <option>Commercial License & SaaS Billing</option>
          <option>Custom Video Production Services</option>
          <option>Technical Support & FFmpeg Help</option>
          <option>YouTube API & OAuth Integration</option>
          <option>Other / General Feedback</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-300 mb-1">Message</label>
        <textarea required rows="4" placeholder="How can LODHI TECHX help your YouTube production workflow?" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-sky-500"></textarea>
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-sky-600/30 transition-all">
        Send Message to LODHI TECHX
      </button>
    </form>
  </main>

  <footer class="mt-20 py-8 border-t border-slate-800 text-center text-xs text-slate-500">
    © 2026 LODHI TECHX. All rights reserved.
  </footer>
</body>
</html>
