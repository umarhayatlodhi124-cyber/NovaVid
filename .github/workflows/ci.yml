name: NovaVid AI Studio CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck & Frontend Build
        run: npm run build

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Run Cargo Rust Native Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify Commercial SaaS Runtime Requirements
        run: powershell -ExecutionPolicy Bypass -File scripts/test_runtime_commercial_saas.ps1
